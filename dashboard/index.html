<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fb" />
    <title>Аналитика ресепшена</title>
    <!-- SVG — основная иконка, она резкая на любом экране; .ico оставлен для
         браузеров, которые SVG в favicon не понимают. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Шрифт подключается в main.tsx (@fontsource-variable/roboto) и едет
         в сборке: внешних запросов за шрифтами нет. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
