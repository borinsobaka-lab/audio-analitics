<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Знак из шапки админки: столбики уровня сигнала. Для иконки их три,
       а не четыре, и они заметно толще — на 16 пикселях тонкие штрихи с
       узкими просветами сливаются в цветное пятно. -->
  <rect width="32" height="32" rx="8" fill="#fc5fff"/>
  <g fill="#ffffff">
    <rect x="4.5"  y="10.5" width="5" height="11" rx="2.5"/>
    <rect x="13.5" y="6"    width="5" height="20" rx="2.5"/>
    <rect x="22.5" y="9"    width="5" height="14" rx="2.5"/>
  </g>
</svg>
