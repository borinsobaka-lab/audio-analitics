# Deployment via Coolify (or plain docker compose) on the Hetzner server.
# Postgres lives in Supabase, audio in Cloudflare R2 — not here.
#
# No host ports are published: Coolify/Traefik routes the api service's
# domain to container port 8000. For plain docker compose, add your own
# override file with a ports mapping.
#
# Variables are interpolated from Coolify's environment settings
# (or from a root .env file when running docker compose by hand).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      API_BASE_URL: ${API_BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-audio-analytics}
      S3_REGION: ${S3_REGION:-auto}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-scribe_v2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL_STAGE1: ${LLM_MODEL_STAGE1:-claude-sonnet-5}
      LLM_MODEL_STAGE2: ${LLM_MODEL_STAGE2:-claude-sonnet-5}
      APP_KEY: ${APP_KEY:-}
      DEVICE_API_KEYS: ${DEVICE_API_KEYS:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
    expose:
      - "8000"
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-audio-analytics}
      S3_REGION: ${S3_REGION:-auto}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-scribe_v2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL_STAGE1: ${LLM_MODEL_STAGE1:-claude-sonnet-5}
      LLM_MODEL_STAGE2: ${LLM_MODEL_STAGE2:-claude-sonnet-5}
    depends_on:
      - redis
    command: celery -A app.celery_app.celery worker --loglevel=info --concurrency=1

volumes:
  redis-data:
